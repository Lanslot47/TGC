<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsletter | The GREEN DEVELOPERS GROUP</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><script>header()</script><main class="wrap"><h1>School Newsletter</h1><p>News, announcements, school activities, achievements and updates from The GREEN DEVELOPERS GROUP.</p><section class="panel"><h2>Subscribe to Updates</h2><form onsubmit="newsletterSubscribe(event)"><label>Full name</label><input name="name" required><label>Email address</label><input name="email" type="email" required><button class="btn">Subscribe</button><p id="msg"></p></form></section><section id="newsletter-admin" class="panel" style="margin-top:22px"><h2>Administrator: Publish Newsletter</h2><form onsubmit="publishNewsletter(event)"><label>Newsletter title</label><input name="title" required><label>Newsletter content</label><textarea name="content" required></textarea><button class="btn">Publish newsletter</button></form></section><h2 style="margin-top:30px">Latest Newsletters</h2><div id="newsletter-list" class="grid" style="margin-top:15px"></div></main><script>footer();renderNewsletters()</script></body></html>
